name: "jacaranda_mentors"
version: "1.0.0"
config-version: 2

profile: "warehouse_mentors_ke"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # true = compile/run against seeds (no ClickHouse source required)
  # false = read Airbyte googlesheets / kobotoolbox sources
  use_sample_seeds: true

models:
  jacaranda_mentors:
    +engine: MergeTree()
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view

    intermediate:
      +materialized: table
      +engine: MergeTree()
      +settings:
        allow_nullable_key: 1

    marts:
      +materialized: table
      +engine: MergeTree()
      +settings:
        allow_nullable_key: 1

    metrics:
      +materialized: table
      +engine: MergeTree()
      +settings:
        allow_nullable_key: 1

seeds:
  jacaranda_mentors:
    +engine: MergeTree()
