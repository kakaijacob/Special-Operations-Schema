version: 2

models:
  - name: metric_emonc_curriculum_completion_by_cycle
    description: Cycle-level full-curriculum completion counts and average component rates.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: mentee_count
        data_tests:
          - not_null
      - name: curriculum_completion_rate
        data_tests:
          - not_null

  - name: metric_emonc_cme_coverage_by_cycle
    description: Cycle-level share of mentees who met the CME requirement (cme_completion >= 1).
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: cme_coverage_rate
        data_tests:
          - not_null

  - name: metric_emonc_drill_coverage_by_cycle
    description: Cycle-level share of mentees who met the drills requirement.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: drill_coverage_rate
        data_tests:
          - not_null

  - name: metric_emonc_skill_demo_coverage_by_cycle
    description: Cycle-level share of mentees who met the skill-demo (mentor) requirement.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: skill_demo_coverage_rate
        data_tests:
          - not_null

  - name: metric_emonc_return_demo_coverage_by_cycle
    description: Cycle-level share of mentees who met the return-demo (mentee) requirement.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: return_demo_coverage_rate
        data_tests:
          - not_null

  - name: metric_emonc_labor_monitoring_coverage_by_cycle
    description: Cycle-level share of mentees who met the labor-monitoring requirement.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: labor_monitoring_coverage_rate
        data_tests:
          - not_null

  - name: metric_emonc_skill_evaluation_coverage_by_cycle
    description: >
      Cycle-level share of mentees who met the skill-evaluation requirement
      (Partograph excluded upstream).
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: skill_evaluation_coverage_rate
        data_tests:
          - not_null

  - name: metric_newborn_curriculum_completion_by_cycle
    description: Cycle-level newborn full-curriculum completion counts and averages.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique
      - name: curriculum_completion_rate
        data_tests:
          - not_null

  - name: metric_newborn_cme_coverage_by_cycle
    description: Cycle-level newborn CME coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: cme_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_drill_coverage_by_cycle
    description: Cycle-level newborn drill coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: drill_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_practicum_coverage_by_cycle
    description: Cycle-level newborn practicum coverage (essential or comprehensive track).
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: practicum_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_skill_demo_coverage_by_cycle
    description: Cycle-level newborn skill-demo coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: skill_demo_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_video_coverage_by_cycle
    description: Cycle-level newborn video coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: video_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_roleplay_coverage_by_cycle
    description: Cycle-level newborn role-play coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: roleplay_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_case_scenario_coverage_by_cycle
    description: Cycle-level newborn case-scenario coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: case_scenario_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_group_discussions_coverage_by_cycle
    description: Cycle-level newborn group-discussion coverage.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: group_discussions_coverage_rate
        data_tests: [not_null]

  - name: metric_newborn_nnr_assessment_coverage_by_cycle
    description: >
      Cycle-level share of mentees with NNR baseline + endline and endline >= 0.85.
    columns:
      - name: cycle_id
        data_tests: [not_null, unique]
      - name: nnr_assessment_coverage_rate
        data_tests: [not_null]
