# CI profile (DBT_PROFILES_DIR=./). Env_var secrets only.

warehouse_mentors_ke:
  target: prod
  outputs:
    prod:
      type: clickhouse
      schema: "{{ env_var('DBT_USER_SCHEMA', '') }}"
      host: "{{ env_var('DBT_HOST', '') }}"
      port: 8443
      user: "{{ env_var('DBT_USER', '') }}"
      password: "{{ env_var('DBT_PASSWORD', '') }}"
      secure: true
      connection:
        method: ssl
        ssl: true
        sslmode: "NONE"
      threads: 3
      retries: 3
      connect_timeout: 30
      send_receive_timeout: 1800

    dev:
      type: clickhouse
      schema: "{{ env_var('DBT_USER_SCHEMA', 'dev_wanyama') }}"
      host: "{{ env_var('DBT_HOST', '') }}"
      port: 8443
      user: "{{ env_var('DBT_USER', '') }}"
      password: "{{ env_var('DBT_PASSWORD', '') }}"
      secure: true
      connection:
        method: ssl
        ssl: true
        sslmode: "NONE"
      threads: 3
      retries: 3
      connect_timeout: 30
      send_receive_timeout: 1800
