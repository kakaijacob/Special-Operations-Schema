name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install dbt-core dbt-clickhouse
      - name: dbt deps
        run: dbt deps
        env:
          DBT_PROFILES_DIR: .
      - name: dbt parse
        run: dbt parse --target prod
        env:
          DBT_PROFILES_DIR: .
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_USER_SCHEMA: ${{ secrets.DBT_USER_SCHEMA }}
        continue-on-error: true
