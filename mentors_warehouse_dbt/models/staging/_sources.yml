# Declare raw tables as Airbyte (or other loaders) land them in ClickHouse.
# Update `schema` / `identifier` to match the real destination database + table names.
#
# Until privileges are fixed you can still edit this file; `dbt run` waits until
# connection works.

version: 2

sources:
  - name: airbyte
    description: Tables loaded into ClickHouse by Airbyte (Kenya mentors warehouse).
    schema: "{{ var('airbyte_schema', 'default') }}"
    tables:
      - name: mentees
        identifier: Mentees
        description: Mentee master data (Google Sheet / Airbyte). Confirm exact table name in ClickHouse.
