# CI / production connection profile, read when DBT_PROFILES_DIR=./ (GitHub
# workflows set that). Local development uses the warehouse_mentors_ke profile in
# ~/.dbt/profiles.yml, which carries a dev target as well.
#
# Schema comes from DBT_USER_SCHEMA: workflows export it, and
# generate_schema_name treats 'dbt_mentors_ke' as the production schema that
# gets per-layer suffixes (e.g. dbt_mentors_ke_gold).
#
# Never put real passwords in this file — only env_var references.

warehouse_mentors_ke:
  target: prod
  outputs:
    prod:
      type: clickhouse
      schema: "{{ env_var('DBT_USER_SCHEMA', '') }}"
      host: "{{ env_var('DBT_HOST', '') }}"
      port: 8443
      user: "{{ env_var('DBT_USER', '') }}"
      password: "{{ env_var('DBT_PASSWORD', '') }}"
      secure: true
      connection:
        method: ssl
        ssl: true
        sslmode: "NONE"
      threads: 3
      retries: 3
      connect_timeout: 30
      send_receive_timeout: 1800

    # Used by local / manual-run workflows. Never defaults to prod's
    # 'dbt_mentors_ke' — caller must supply a schema (or use the local default).
    dev:
      type: clickhouse
      schema: "{{ env_var('DBT_USER_SCHEMA', 'dev_scratch') }}"
      host: "{{ env_var('DBT_HOST', '') }}"
      port: 8443
      user: "{{ env_var('DBT_USER', '') }}"
      password: "{{ env_var('DBT_PASSWORD', '') }}"
      secure: true
      connection:
        method: ssl
        ssl: true
        sslmode: "NONE"
      threads: 3
      retries: 3
      connect_timeout: 30
      send_receive_timeout: 1800
