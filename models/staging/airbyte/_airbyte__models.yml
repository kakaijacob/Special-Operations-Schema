version: 2

models:
  - name: stg_airbyte__mentees
    description: Cleaned and standardized mentee records from the Airbyte Google Sheets sync.
    columns:
      - name: mentee_id
        description: Mentee identifier supplied by the source sheet.
        data_tests:
          - not_null
      - name: mentee_name
        data_tests:
          - not_null
      - name: county
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Busia
                  - Kakamega
                  - Kiambu
                  - Kilifi
                  - Kirinyaga
                  - Kisii
                  - Machakos
                  - Makueni
                  - Meru
                  - Mombasa
                  - Muranga
                  - Nairobi
                  - Nakuru
                  - Siaya
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [Active, Inactive]
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: [Male, Female]
