version: 2

models:
  - name: int_emonc_cohorts
    description: Cohort date windows and curriculum requirements.
    columns:
      - name: cycle_id
        data_tests:
          - not_null
          - unique

  - name: int_emonc_mentees
    description: Mentee spine preferring master data while retaining fact-only mentees.
    columns:
      - name: mentee_id
        data_tests:
          - not_null
          - unique

  - name: int_emonc_mentee_cycles
    description: Every eligible mentee crossed with every configured cohort.
    columns:
      - name: mentee_id
        data_tests:
          - not_null
      - name: cycle_id
        data_tests:
          - not_null

  - name: int_emonc_curriculum_activity_progress
    description: Distinct activity-topic counts and dates when each cycle threshold was reached.

  - name: int_emonc_skill_evaluation_progress
    description: Per-cycle skill pass counts, average maximum score, and threshold date.
